[project]
name = "recipe-agents-learning-lab"
version = "0.2.0"
description = "A small, observable multi-agent recipe API built with FastAPI, Pydantic, Strands, and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "pydantic-settings>=2.7,<3",
  "strands-agents[ollama,otel]>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
